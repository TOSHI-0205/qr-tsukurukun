<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>転送中... - QRつくるくん</title>
  <style>
    :root { --primary: #2563eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial,
        "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 800; color: #111827; margin-bottom: 10px; }
    p { font-size: 14px; color: #6b7280; line-height: 1.7; margin-top: 6px; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .dest-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--primary);
      word-break: break-all;
      margin-top: 8px;
      display: block;
    }
    .err-icon { font-size: 36px; margin-bottom: 14px; }
    .back {
      display: inline-block;
      margin-top: 22px;
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .back:hover { text-decoration: underline; }
    .note {
      margin-top: 14px;
      padding: 12px 14px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      font-size: 13px;
      color: #78350f;
      text-align: left;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">転送中...</h1>
    <p id="desc">しばらくお待ちください。</p>
  </div>

  <script>
  (function () {
    'use strict';

    var LINKS_KEY = 'qrtsLinks';
    var id = new URLSearchParams(location.search).get('id') || '';

    var spinner = document.getElementById('spinner');
    var title   = document.getElementById('title');
    var desc    = document.getElementById('desc');
    var card    = document.getElementById('card');

    /** テキストを HTML にそのまま差し込むときに使う（XSS防止） */
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(heading, bodyHtml, showLocalStorageNote) {
      spinner.style.display = 'none';
      card.insertAdjacentHTML('afterbegin', '<div class="err-icon">⚠️</div>');
      title.textContent = heading;
      desc.innerHTML = bodyHtml;
      if (showLocalStorageNote) {
        var note = document.createElement('div');
        note.className = 'note';
        note.innerHTML =
          '<strong>このQRコードについて</strong><br>' +
          'このQRコードは <strong>QRつくるくん</strong> の「可変QR」機能で作成されています。' +
          'リンクデータはブラウザの localStorage に保存されているため、' +
          '<strong>登録した端末・ブラウザと同じ環境</strong>でのみ転送が可能です。<br>' +
          '<a class="back" href="./">QRつくるくんへ戻る</a>';
        card.appendChild(note);
      } else {
        desc.innerHTML += '<br><a class="back" href="./">QRつくるくんへ戻る</a>';
      }
    }

    // ID が指定されていない
    if (!id) {
      showError(
        'IDが指定されていません',
        'URLに <code>?id=●●</code> が必要です。QRつくるくんで可変QRを作り直してください。',
        false
      );
      return;
    }

    // localStorage からリンクを検索
    var links = {};
    try {
      var raw = localStorage.getItem(LINKS_KEY);
      if (raw) links = JSON.parse(raw);
    } catch (e) {
      // localStorage が使えない環境（プライベートブラウズ等）
      showError(
        'データを読み込めません',
        'このブラウザでは localStorage が使用できません。',
        true
      );
      return;
    }

    var url = links && links[id];

    // ID に対応する URL が見つからない
    if (!url) {
      showError(
        '転送先が見つかりません',
        '<code>' + esc(id) + '</code> に対応するURLが登録されていません。',
        true
      );
      return;
    }

    // 転送先 URL を一瞬表示してから移動
    title.textContent = '転送中...';
    desc.innerHTML = '<span class="dest-url">' + esc(url) + '</span>';
    location.replace(url);

  }());
  </script>
</body>
</html>
